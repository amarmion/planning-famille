<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Famille</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 🔐 ÉCRAN DE CONNEXION -->
<div id="loginScreen" class="screen active">
    <div class="login-container">
        <h1>📅 Planning Famille</h1>
        <p>Synchronisation en temps réel</p>

        <div class="user-buttons">
            <button class="user-btn" onclick="selectUser('alban')">👨 Alban</button>
            <button class="user-btn" onclick="selectUser('elodie')">👩 Elodie</button>
            <button class="user-btn" onclick="selectUser('papimamie')">👴👵 Papi/Mamie</button>
        </div>

        <div id="pinInput" style="display:none;">
            <input type="password" id="pinField" placeholder="Entrez le code PIN" maxlength="4">
            <button onclick="login()">Se connecter</button>
            <button onclick="cancelLogin()" style="background:#ccc;">Annuler</button>
        </div>

        <div id="errorMsg" class="error" style="display:none;"></div>
    </div>
</div>

<!-- 📅 ÉCRAN PRINCIPAL -->
<div id="mainScreen" class="screen">
    <header>
        <h1>📅 Planning Famille</h1>
        <div class="user-info">
            <span id="userName"></span>
            <button onclick="logout()" class="logout-btn">Déconnexion</button>
        </div>
    </header>

    <nav class="tabs">
        <button class="tab-btn active" onclick="switchTab('events')">📅 Événements</button>
        <button class="tab-btn" onclick="switchTab('tasks')">✓ Tâches</button>
    </nav>

    <!-- 📅 TAB ÉVÉNEMENTS -->
    <div id="eventsTab" class="tab-content active">
        <div id="parentOptions" style="display:none;">
            <button onclick="showAddEventForm()" class="add-btn">+ Ajouter un événement</button>
        </div>

        <div id="addEventForm" style="display:none;" class="form-container">
            <h3>Nouvel événement</h3>
            <input type="text" id="eventTitle" placeholder="Titre" required>
            <input type="date" id="eventDate" required>
            <input type="time" id="eventTime">
            <textarea id="eventDesc" placeholder="Description..."></textarea>
            <label>
                <input type="checkbox" id="eventShare"> Visible à Papi/Mamie
            </label>
            <button onclick="saveEvent()">💾 Enregistrer</button>
            <button onclick="closeEventForm()" style="background:#ccc;">Annuler</button>
        </div>

        <div id="eventsList" class="events-list"></div>
    </div>

    <!-- ✓ TAB TÂCHES -->
    <div id="tasksTab" class="tab-content">
        <div id="parentTaskOptions" style="display:none;">
            <button onclick="showAddTaskForm()" class="add-btn">+ Ajouter une tâche</button>
        </div>

        <div id="addTaskForm" style="display:none;" class="form-container">
            <h3>Nouvelle tâche</h3>
            <input type="text" id="taskTitle" placeholder="Description de la tâche" required>
            <input type="date" id="taskDueDate">
            <button onclick="saveTask()">💾 Enregistrer</button>
            <button onclick="closeTaskForm()" style="background:#ccc;">Annuler</button>
        </div>

        <div id="tasksList" class="tasks-list"></div>
    </div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
