<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Famille</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .btn-add { background: #4CAF50; color: white; font-size: 1.2em; }
        .btn-add:hover { background: #45a049; }
        .calendar { padding: 30px; }
        .month-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .month-header h2 { font-size: 2em; color: #333; }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }
        .day-header {
            text-align: center;
            font-weight: bold;
            color: #667eea;
            padding: 10px;
            border-bottom: 2px solid #667eea;
        }
        .day-cell {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            min-height: 120px;
            background: #f9f9f9;
            cursor: pointer;
            transition: all 0.3s;
        }
        .day-cell:hover { background: #f0f0f0; box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
        .day-cell.other-month { color: #ccc; background: #fafafa; }
        .day-number { font-weight: bold; color: #333; margin-bottom: 8px; font-size: 1.1em; }
        .event-item {
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 5px;
            margin: 3px 0;
            font-size: 0.78em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .event-delete {
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 2px 5px;
            cursor: pointer;
            font-size: 0.75em;
            margin-left: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📅 Planning Famille</h1>
            <p>Organisez vos événements en famille</p>
            <div class="controls">
                <button class="btn-add" onclick="openAddModal()">➕ Ajouter</button>
                <button onclick="previousMonth()">◀ Précédent</button>
                <button onclick="nextMonth()">Suivant ▶</button>
                <button onclick="logout()">🚪 Déconnexion</button>
            </div>
        </header>

        <div class="calendar">
            <div class="month-header">
                <h2 id="monthYear"></h2>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>

    <!-- MODAL AJOUTER -->
    <div id="addModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center;">
        <div style="background:white; padding:30px; border-radius:15px; max-width:500px; width:90%;">
            <h2>➕ Ajouter un événement</h2>
            <form id="eventForm" onsubmit="addEvent(event)">
                <div style="margin:15px 0;">
                    <label>Date :</label>
                    <input type="date" id="eventDate" required style="width:100%; padding:10px; border:1px solid #ddd; border-radius:5px;">
                </div>
                <div style="margin:15px 0;">
                    <label>Titre :</label>
                    <input type="text" id="eventTitle" required style="width:100%; padding:10px; border:1px solid #ddd; border-radius:5px;">
                </div>
                <div style="margin:15px 0;">
                    <label>Catégorie :</label>
                    <select id="eventCategory" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:5px;">
                        <option value="Anniversaire">🎂 Anniversaire</option>
                        <option value="Réunion">📞 Réunion</option>
                        <option value="Sport">⚽ Sport</option>
                        <option value="Médecin">🏥 Médecin</option>
                        <option value="École">🎓 École</option>
                        <option value="Loisir">🎨 Loisir</option>
                        <option value="Autre">📌 Autre</option>
                    </select>
                </div>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button type="submit" style="flex:1; background:#4CAF50; color:white; padding:12px; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">✅ Ajouter</button>
                    <button type="button" onclick="closeAddModal()" style="flex:1; background:#ff9800; color:white; padding:12px; border:none; border-radius:5px; cursor:pointer;">❌ Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <!-- FIREBASE COMPAT (version 9 compat = fonctionne sans module) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBYKeXpqIHzxv88byZ-ujozhcrKRTpSiBE",
            authDomain: "planning-famille-cda1a.firebaseapp.com",
            databaseURL: "https://planning-famille-cda1a-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "planning-famille-cda1a",
            storageBucket: "planning-famille-cda1a.appspot.com",
            messagingSenderId: "720570302220",
            appId: "1:720570302220:web:d8e830783665b1ed2cd329"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let currentDate = new Date();
        let currentUser = null;
        let allEvents = {};

        // VÉRIFIER CONNEXION
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                loadEvents();
            } else {
                window.location.href = "login.html";
            }
        });

        // CHARGER ÉVÉNEMENTS
        function loadEvents() {
            const ref = database.ref('families/' + currentUser.uid + '/events');
            ref.on('value', (snapshot) => {
                allEvents = {};
                snapshot.forEach((child) => {
                    const e = child.val();
                    if (!allEvents[e.date]) allEvents[e.date] = [];
                    allEvents[e.date].push({ id: child.key, ...e });
                });
                renderCalendar();
            });
        }

        // OUVRIR/FERMER MODAL
        function openAddModal() {
            document.getElementById('addModal').style.display = 'flex';
        }
        function closeAddModal() {
            document.getElementById('addModal').style.display = 'none';
            document.getElementById('eventForm').reset();
        }

        // AJOUTER ÉVÉNEMENT
        function addEvent(e) {
            e.preventDefault();
            const date = document.getElementById('eventDate').value;
            const title = document.getElementById('eventTitle').value;
            const category = document.getElementById('eventCategory').value;

            database.ref('families/' + currentUser.uid + '/events').push({
                date, title, category,
                createdBy: currentUser.email,
                createdAt: new Date().toISOString()
            }).then(() => {
                closeAddModal();
            }).catch((err) => {
                alert('❌ Erreur: ' + err.message);
            });
        }

        // SUPPRIMER ÉVÉNEMENT
        function deleteEvent(eventId) {
            if (confirm('Supprimer cet événement?')) {
                database.ref('families/' + currentUser.uid + '/events/' + eventId).remove();
            }
        }

        // AFFICHER CALENDRIER
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('monthYear').textContent =
                currentDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();
            const startDay = firstDay === 0 ? 6 : firstDay - 1;

            let html = '';
            ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].forEach(d => {
                html += `<div class="day-header">${d}</div>`;
            });

            for (let i = startDay - 1; i >= 0; i--) {
                html += `<div class="day-cell other-month"><div class="day-number">${daysInPrevMonth - i}</div></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                const events = allEvents[dateStr] || [];
                html += `<div class="day-cell" onclick="openAddModal()">
                    <div class="day-number">${day}</div>`;
                events.forEach(ev => {
                    html += `<div class="event-item">
                        <span>${ev.title}</span>
                        <button class="event-delete" onclick="event.stopPropagation();deleteEvent('${ev.id}')">✕</button>
                    </div>`;
                });
                html += `</div>`;
            }

            const totalDays = startDay + daysInMonth;
            const remaining = totalDays % 7 === 0 ? 0 : 7 - (totalDays % 7);
            for (let i = 1; i <= remaining; i++) {
                html += `<div class="day-cell other-month"><div class="day-number">${i}</div></div>`;
            }

            document.getElementById('calendarGrid').innerHTML = html;
        }

        function previousMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        }
        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        }
        function logout() {
            auth.signOut().then(() => { window.location.href = "login.html"; });
        }
    </script>
</body>
</html>
